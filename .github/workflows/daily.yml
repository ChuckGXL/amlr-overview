name: Daily source check

on:
  schedule:
    - cron: "17 6 * * *"   # every day 06:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Date the instruments whose details changed
        run: python monitor/stamp.py

      - name: Read feeds and APIs, update the digest
        run: python monitor/fetch.py

      - name: Check source links (monthly)
        run: python monitor/linkcheck.py --if-due

      - name: Commit the new digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Daily source check $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
